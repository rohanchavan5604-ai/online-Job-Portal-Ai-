<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Jobs - Job Portal AI</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

<!-- ================= NAVBAR ================= -->

<div class="navbar">

    <h2 class="logo">
        Job Portal AI
    </h2>

    <div class="nav-links">

        <a href="profile.html">
            Profile
        </a>

        <a href="#" onclick="goToMyApplications()">
            My Applications
        </a>


        <!-- ================= NOTIFICATION ================= -->

        <div class="notification-wrapper">

            <button
                class="notification-button"
                onclick="toggleNotifications()">

                🔔

                <span
                    id="notificationCount"
                    class="notification-count">
                    0
                </span>

            </button>


            <!-- Notification Dropdown -->

            <div
                id="notificationDropdown"
                class="notification-dropdown">

                <div class="notification-header">

                    <h3>
                        Notifications
                    </h3>

                    <button
                        onclick="markAllNotificationsRead()">

                        Mark all as read

                    </button>

                </div>


                <div
                    id="notificationList"
                    class="notification-list">

                    <p>
                        Loading notifications...
                    </p>

                </div>

            </div>

        </div>


        <!-- ================= LOGOUT ================= -->

        <a href="#" onclick="logout()">
            Logout
        </a>

    </div>

</div>


    <!-- ================= AI RECOMMENDATIONS ================= -->

<section class="ai-recommendations">

    <div class="ai-recommendation-header">

        <h2>🤖 AI Recommended Jobs</h2>

        <p>
            Jobs matched with your resume using AI
        </p>

    </div>

    <div id="recommendedJobsContainer">

        <p>Loading AI recommendations...</p>

    </div>

</section>

    <!-- ================= JOB SEARCH ================= -->

    <section class="job-search">

        <h2>Search Jobs</h2>


        <!-- SEARCH -->

        <div class="search-container">

            <input
                type="text"
                id="searchTitle"
                placeholder="Job Title"
            >


            <input
                type="text"
                id="searchLocation"
                placeholder="Location"
            >


            <select id="sortOption">

                <option value="latest">
                    Latest
                </option>

                <option value="salaryHigh">
                    Salary High → Low
                </option>

                <option value="salaryLow">
                    Salary Low → High
                </option>

            </select>


            <button onclick="searchJobs()">
                Search
            </button>

        </div>


        <!-- ================= JOBS ================= -->

        <div id="jobsContainer">

            <!-- Jobs loaded by app.js -->

        </div>

    </section>

    <!-- CUSTOM MODAL -->

<div id="customModal" class="custom-modal">

    <div class="modal-overlay"></div>

    <div class="modal-box">

        <div id="modalIcon" class="modal-icon">
            !
        </div>

        <h2 id="modalTitle">
            Resume Required
        </h2>

        <p id="modalMessage">
            Please upload your resume before applying for a job.
        </p>

        <div class="modal-buttons">

            <button
                id="modalCancelBtn"
                class="modal-cancel">
                Cancel
            </button>

            <button
                id="modalActionBtn"
                class="modal-action">
                Go to Profile
            </button>

        </div>

    </div>

</div>

    <!-- ================= JAVASCRIPT ================= -->

    <script src="js/app.js"></script>

</body>

</html>
