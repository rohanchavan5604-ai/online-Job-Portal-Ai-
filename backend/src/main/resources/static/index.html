<!DOCTYPE html>
<html>
<head>
    <title>JobPortal</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="css/style.css">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
</head>
<body>

<div class="navbar">
    <h2 class="logo">JobPortal</h2>
    <div class="nav-links">
        <a href="login.html">Login</a>
        <a href="register.html">Register</a>
        <a href="jobs.html">Jobs</a>
    </div>
</div>

<section class="hero">

    <div id="tsparticles"></div>

    <div class="hero-content">
        <span class="badge">AI Powered Platform</span>
        <h1>Build Your Future Career</h1>
        <p>Discover premium opportunities powered by intelligent matching technology.</p>

        <div class="hero-buttons">
            <button class="btn-primary" onclick="window.location.href='jobs.html'">
                Explore Jobs
            </button>
            <button class="btn-outline" onclick="window.location.href='register.html'">
                Get Started
            </button>
        </div>
    </div>
</section>
 
<section class="stats">
    <div class="stat">
        <h3 data-count="1200">0</h3>
        <p>Active Jobs</p>
    </div>
    <div class="stat">
        <h3 data-count="350">0</h3>
        <p>Companies</p>
    </div>
    <div class="stat">
        <h3 data-count="5000">0</h3>
        <p>Applications</p>
    </div>
    <div class="stat">
        <h3 data-count="98">0</h3>
        <p>Success Rate</p>
    </div>
</section>

<script src="https://cdn.jsdelivr.net/npm/tsparticles@2/tsparticles.bundle.min.js"></script>

<script>
gsap.registerPlugin(ScrollTrigger);

gsap.from(".badge", {y:-20, opacity:0, duration:1});
gsap.from(".hero h1", {y:40, opacity:0, duration:1, delay:0.3});
gsap.from(".hero p", {y:40, opacity:0, duration:1, delay:0.6});
gsap.from(".hero-buttons", {y:40, opacity:0, duration:1, delay:0.9});

window.addEventListener("scroll", function() {
    const nav = document.querySelector(".navbar");
    nav.classList.toggle("shrink", window.scrollY > 50);
});

gsap.utils.toArray(".stat h3").forEach(el => {
    let target = +el.dataset.count;
    gsap.to(el, {
        innerText: target,
        duration: 2,
        snap: { innerText: 1 },
        scrollTrigger: {
            trigger: el,
            start: "top 80%"
        }
    });
});

tsParticles.load("tsparticles", {
    background: { color: "transparent" },
    particles: {
        number: { value: 60 },
        color: { value: "#38bdf8" },
        size: { value: 3 },
        move: { enable: true, speed: 1 },
        links: {
            enable: true,
            color: "#38bdf8",
            opacity: 0.3
        }
    }
});
</script>

</body>
</html>
