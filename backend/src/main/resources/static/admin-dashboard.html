<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Admin Dashboard</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="navbar">
    <h2 class="logo">Admin Dashboard</h2>
    <div class="nav-links">
        <a href="jobs.html">Jobs</a>
        <a href="#" onclick="logout()">Logout</a>
    </div>
</div>

<section class="job-search">
    <h2>System Overview</h2>

    <div class="search-container">

        <div class="job-card">
            <h3>Total Jobs</h3>
            <p id="totalJobs">0</p>
        </div>

        <div class="job-card">
            <h3>Total Users</h3>
            <p id="totalUsers">0</p>
        </div>

        <div class="job-card">
            <h3>Total Applications</h3>
            <p id="totalApplications">0</p>
        </div>

        <div class="job-card">
            <h3>Shortlisted</h3>
            <p id="totalShortlisted">0</p>
        </div>

        <div class="job-card">
            <h3>Interview Scheduled</h3>
            <p id="totalInterviewScheduled">0</p>
        </div>

        <div class="job-card">
            <h3>Rejected</h3>
            <p id="totalRejected">0</p>
        </div>

    </div>
</section>

<section class="job-search">
    <h2>Applications Management</h2>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>User</th>
                    <th>Email</th>
                    <th>Job</th>
                    <th>Status</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="applicationsTable">
            </tbody>
        </table>
    </div>
</section>

<script src="js/admin.js"></script>

</body>
</html>
